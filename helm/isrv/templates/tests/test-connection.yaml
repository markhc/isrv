apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "isrv.fullname" . }}-test-connection"
  labels:
    {{- include "isrv.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', '{{ include "isrv.fullname" . }}:{{ .Values.service.port }}/healthz']
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
