name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.26
    - name: Cache Go modules
      uses: actions/cache@v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Install pnpm
      run: npm install -g pnpm

    - name: Get Cache Store Path
      run: |
        PNPM_STORE_PATH=$(pnpm store path)
        echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> $GITHUB_ENV

    - name: Cache pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Build
      run: make build

    - name: Run tests
      run: make test

  build_artifacts:
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Get Cache Store Path
        run: |
          PNPM_STORE_PATH=$(pnpm store path)
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Building targets
        run: make build-all

      - name: Create tarball
        run: |
          tar -czvf isrv-linux-amd64.tar.gz -C build isrv-linux-amd64 && \
          tar -czvf isrv-linux-arm64.tar.gz -C build isrv-linux-arm64 && \
          tar -czvf isrv-darwin-amd64.tar.gz -C build isrv-darwin-amd64 && \
          tar -czvf isrv-darwin-arm64.tar.gz -C build isrv-darwin-arm64

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            isrv-linux-amd64.tar.gz \
            isrv-linux-arm64.tar.gz \
            isrv-darwin-amd64.tar.gz \
            isrv-darwin-arm64.tar.gz \
            --clobber \
            --repo ${{ github.repository }}

  docker_build:
    needs: [release-please, verify]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            markhc/isrv:latest
            markhc/isrv:${{ needs.release-please.outputs.tag_name }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            BUILD_VERSION=${{ needs.release-please.outputs.tag_name }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_release:
    needs: [release-please, build_artifacts, docker_build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ needs.release-please.outputs.tag_name }} \
            --draft=false --repo ${{ github.repository }}
