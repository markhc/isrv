name: Create Release on Tag Push
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: 1.26
    - name: Cache Go modules
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

    - name: Setup Node.js
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
      with:
        node-version: 22
    - name: Install pnpm
      run: npm install -g pnpm
    
    - name: Get Cache Store Path
      run: |
        PNPM_STORE_PATH=$(pnpm store path)
        echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> $GITHUB_ENV

    - name: Cache pnpm store
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

    - name: Build
      run: make build

    - name: Run tests
      run: make test

  build_artifacts:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26
      - name: Cache Go modules
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Get Cache Store Path
        run: |
          PNPM_STORE_PATH=$(pnpm store path)
          echo "PNPM_STORE_PATH=$PNPM_STORE_PATH" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Get Release Version
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Building targets
        run: make build-all

      - name: Create tarball
        run: |
          tar -czvf isrv-linux-amd64.tar.gz -C build isrv-linux-amd64 && \
          tar -czvf isrv-linux-arm64.tar.gz -C build isrv-linux-arm64 && \
          tar -czvf isrv-darwin-amd64.tar.gz -C build isrv-darwin-amd64 && \
          tar -czvf isrv-darwin-arm64.tar.gz -C build isrv-darwin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.get_version.outputs.RELEASE_VERSION }}
          name: Release ${{ steps.get_version.outputs.RELEASE_VERSION }}
          files: |
            isrv-linux-amd64.tar.gz
            isrv-linux-arm64.tar.gz
            isrv-darwin-amd64.tar.gz
            isrv-darwin-arm64.tar.gz
            
  docker_build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get Release Version
        id: get_version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: |
            markhc/isrv:latest
            markhc/isrv:${{ steps.get_version.outputs.RELEASE_VERSION }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          build-args: |
            BUILD_VERSION=${{ steps.get_version.outputs.RELEASE_VERSION }}
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max