# Defines the configuration version.
# The only possible value is "2".
version: "2"

linters:
  default: all
  disable:
    - err113   # "do not define dynamic errors"
    - depguard
    - errcheck
    - exhaustruct
    - gochecknoglobals
    - gocognit
    - gomodguard
    - gosec
    - cyclop
    - funlen
    - mnd
    - nestif
    - nlreturn # fiber handler chains generate many short returns
    - contextcheck # fiber.Ctx propagates request context via c.Context()
    - revive
    - noinlineerr
    - varnamelen
    - wsl
    - wsl_v5
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/gofiber/fiber/*
        - github.com/markhc/isrv/internal/utils
    goconst:
      min-occurrences: 5
      min-len: 5

formatters:
  enable:
    - goimports
    - gofumpt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  relative-path-mode: gomod
  tests: false