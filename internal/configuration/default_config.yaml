# Default configuration for iSRV

# friendly name for the server, used in the HTML title and also in logs and responses
serverName: "iSRV"

# frontend url of the server, used for generating links in responses. Should include protocol and port if not default
serverUrl: http://localhost:8080

# host and port to listen on
serverHost: 0.0.0.0
serverPort: 8080

# maximum file size in megabytes for uploads
maxFileSizeMb: 512

# minimum and maximum age of files in days before they are automatically deleted by the cleanup routine
# the minimum age can be overridden by a query parameter in the upload request, but the maximum age is fixed
minAgeDays: 30
maxAgeDays: 365

# length of randomly generated file ids
randomIdLength: 12

# whether to keep the original filename in the upload response and in the database.
# Has no effect on the actual stored filename, which is always a random ID.
keepOriginalFilename: true

# Disables the index page that shows project information and help, among other things.
disableIndexPage: false
# Disables the upload page that allows users to upload files through a web form.
disableUploadPage: true

# URL and format for the favicon. If empty, no favicon will be served.
# Can be a local file path or remote URL.
# The URL will be fetched and cached on startup. 
faviconUrl: ""
faviconFormat: "png"

# admin panel configuration
# The admin panel lets a single administrator view, search, preview and delete
# uploaded files. It is reachable at /admin and is NOT linked from the home page.
# The panel is enabled only when both username and password are set (here or via
# the ISRV_ADMIN_USERNAME / ISRV_ADMIN_PASSWORD environment variables).
admin:
  # administrator credentials. Leave empty to disable the admin panel entirely.
  username: ""
  password: ""
  # HMAC key used to sign session cookies. If empty, a random key is generated
  # at startup, which invalidates existing sessions on every restart. Set a
  # stable value to keep sessions valid across restarts.
  sessionSecret: ""
  # how long an admin login session remains valid
  sessionTtl: 24h

# storage configuration
storage:
  # supported types: local, s3
  type: local
  # for local storage, this is the directory where files will be saved. For S3, this is the base path within the bucket (can be empty)
  basePath: ./upload_data/
  # for S3 storage, these are the required credentials and settings. For local storage, these can be left empty
  accessKey: ""
  secretKey: ""
  bucketName: ""
  # AWS region. Required when no endpoint is set
  region: ""
  # custom endpoint for S3-compatible stores (MinIO, GCS, ...). Leave empty for AWS S3.
  endpoint: ""
  # when true, downloads are streamed through the server instead of
  # redirecting the client to a pre-signed S3 URL. Uses server bandwidth but
  # hides the storage endpoint and keeps download URLs stable.
  proxyDownloads: false
  # multipart upload tuning. Large uploads are split into parts of
  # uploadPartSizeMb MiB (minimum 5MiB) and uploaded with uploadConcurrency
  # parallel workers. Zero values use the SDK defaults.
  uploadPartSizeMb: 0
  uploadConcurrency: 0

database:
  # supported types: sqlite, postgres
  type: sqlite
  
  # for sqlite, this is the DSN (Data Source Name) which specifies the file path and options. 
  # for postgres, this can be a connection string or a set of parameters.
  #
  # when set, the DSN overrides all other database settings.
  dsn: file:isrv.db?cache=shared&mode=rwc

  # database file path for sqlite
  filePath: ""

  # connection parameters for postgres. These can be left empty if using sqlite or if the DSN is set.
  host: ""
  port: 0
  user: ""
  password: ""
  dbName: ""

security:
  # Whether to validate IP addresses in requests.
  #
  # If true, we will attempt to parse and validate headers to find the real
  # client IP, even if the request is coming through a proxy.
  #
  # If you don't care about rate limiting or logging the real client IP, 
  # you can set this to false for a small performance gain.
  validateIpAddresses: true

  # list of trusted proxy IPs or CIDR ranges for correctly identifying client IPs behind proxies.
  # This is important for accurate rate limiting and logging.
  # If your server is behind a reverse proxy (like NGINX, Cloudflare, etc.), 
  # you should add the proxy's IP address or CIDR range here.
  # example:
  # trustedProxies:
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"
  trustedProxies: []

  # rate limit configuration
  # applies to upload, expire and delete endpoints, but not to download or index page
  rateLimit:
    enabled: true
    requestsPerMinute: 30
    burstSize: 10 # number of requests allowed in a short burst before enforcing the rate limit
    whitelistIps: []
    # supported actions: 
    # "throttle" (respond with 429 Too Many Requests and a Retry-After header)
    # "block" (respond with 403 Forbidden and block the IP for a certain duration)
    # "none" (no action, just log the event)
    onLimitExceeded: "throttle"
    # duration to block IPs that exceed the limit, only applicable if action is "block"
    blockDuration: 15m
    # block duration will increase exponentially for repeated offenses
    blockExponentialBackoff: true

# logging configuration
logging:
  level: info      # log level: debug, info, warn, error
  logToFile: false # whether to log to a file alongside stdout.
  path: ./isrv.log # path to the log file if logToFile is true
  logIps: true     # log the client IP address for each request
  # File rotation
  maxSizeMb: 100   # rotate when the active file reaches this many MiB
  maxBackups: 7    # retain at most this many rotated files (0 = unlimited)
  maxAgeDays: 30   # delete rotated files older than this (0 = never)
  compress: true   # gzip-compress rotated files

# cleanup configuration
cleanup:
  enabled: true
  interval: 1m

# server-side encryption at rest
# When enabled, new uploads are encrypted before reaching the storage backend
# and transparently decrypted on download. Existing plaintext files remain
# readable. Decryption only requires an identity to be configured; setting
# `enabled: false` while keeping an identity stops encrypting new uploads but
# keeps existing encrypted files downloadable.
encryption:
  # encrypt new uploads
  enabled: false
  # age X25519 identity (AGE-SECRET-KEY-1...). Generate one with 'isrv --gen-encryption-key'. 
  # Prefer using identityFile to avoid storing the secret in plaintext in the config file.
  identity: ""
  # path to a file containing the identity, in age-keygen output format.
  # Set either identity or identityFile, not both.
  identityFile: ""

# enable debug mode for more verbose logging and additional information in responses
debug: false
